site_name: WebNR - Web Novel Reader
site_description: A private, local-first, cross-platform browser reader for TXT web novels and long-form text
site_author: AutoArchive contributors
site_url: https://www.webnovel.win/
repo_url: https://github.com/AutoArchive/webNR
repo_name: AutoArchive/webNR
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  custom_dir: overrides
  font: false
  language: en
  features:
    - content.action.edit
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - privacy
  - blog:
      categories: false
      post_excerpt_max_categories: 0
      pagination_per_page: 6
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

extra:
  analytics:
    provider: google
    property: G-DGH8HNQKE4
  homepage: https://www.webnovel.win/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AutoArchive/webNR
      name: WebNR source code
    - icon: fontawesome/solid/book-open-reader
      link: https://app.webnovel.win/
      name: Open WebNR reader

copyright: Copyright &copy; 2025–2026 AutoArchive contributors
