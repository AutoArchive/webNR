name: Diagnose WebNR public routing

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DNS and public origins
        shell: bash
        run: |
          set -u
          hosts=(
            www.webnovel.win
            app.webnovel.win
            webnr.pages.dev
            seo-restore-www-canonical-20.webnr.pages.dev
            autoarchive.github.io
          )
          for host in "${hosts[@]}"; do
            echo "===== DNS ${host} ====="
            getent ahostsv4 "${host}" | head -n 8 || true
            echo
          done

          urls=(
            https://www.webnovel.win/
            https://www.webnovel.win/build.json
            https://webnr.pages.dev/
            https://webnr.pages.dev/build.json
            https://seo-restore-www-canonical-20.webnr.pages.dev/
            https://seo-restore-www-canonical-20.webnr.pages.dev/build.json
            https://autoarchive.github.io/webNR/
            https://autoarchive.github.io/webNR/build.json
            https://app.webnovel.win/
            https://app.webnovel.win/build.json
          )
          for url in "${urls[@]}"; do
            echo "===== HTTP ${url} ====="
            headers="$(mktemp)"
            body="$(mktemp)"
            if curl --location --silent --show-error --max-time 20 \
              --dump-header "${headers}" --output "${body}" \
              "${url}?routing-diagnostic=${GITHUB_SHA}"; then
              sed -n '1,25p' "${headers}"
              echo '--- selected body evidence ---'
              grep -Eio '<title>[^<]*|rel="canonical" href="[^"]*|"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"|G-DGH8HNQKE4|2026 年哪里能合法免费看小说|WebNR Documentation|WebNR - Web Novel Reader' "${body}" | head -n 20 || true
              echo "body-bytes=$(wc -c < "${body}")"
            else
              echo 'request-failed'
            fi
            rm -f "${headers}" "${body}"
            echo
          done
