name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository and skills
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency tree
        run: |
          npm audit --json > "${RUNNER_TEMP}/npm-audit.json" || true
          node scripts/validate-npm-audit.mjs "${RUNNER_TEMP}/npm-audit.json"
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Validate application analytics output
        run: |
          set -eu
          test -f out/index.html
          grep -R -Fq 'G-DGH8HNQKE4' out
          if grep -R -Fq 'G-NL0WV2XMJN' out; then
            echo 'Obsolete secondary GA4 destination found in application output' >&2
            exit 1
          fi
          grep -R -Fq 'window.location.href' out
          grep -R -Fq 'window.location.pathname + window.location.search' out
          grep -R -Fq 'allow_google_signals' out
          grep -R -Fq 'allow_ad_personalization_signals' out
          grep -R -Fq 'independent browser-based alternative' out
      - name: Validate source output
        run: |
          set -eu
          test -f out/sources/webnr-originals/search_index.yml
          test -f out/sources/webnr-originals/stories/lantern-index.txt
          test -f out/sources/webnr-originals/README.txt
          grep -Fq 'title: 灯下索引' out/sources/webnr-originals/search_index.yml
          grep -Fq 'license: CC0-1.0' out/sources/webnr-originals/search_index.yml
          grep -Fq 'page_url: https://www.webnovel.win/blog/2026/08/06/legado-source-guide/' out/sources/webnr-originals/search_index.yml
          grep -Fq '《灯下索引》' out/sources/webnr-originals/stories/lantern-index.txt
          test -f out/sources/aozora-starter/search_index.yml
          test -f out/sources/aozora-starter/README.txt
          grep -Fq 'title: 吾輩は猫である' out/sources/aozora-starter/search_index.yml
          grep -Fq 'title: 羅生門' out/sources/aozora-starter/search_index.yml
          grep -Fq 'license: CC-BY-4.0-metadata' out/sources/aozora-starter/search_index.yml
          grep -Fq 'https://www.aozora.gr.jp/cards/000148/card789.html' out/sources/aozora-starter/search_index.yml
          test -f out/sources/standard-ebooks-starter/search_index.yml
          test -f out/sources/standard-ebooks-starter/README.txt
          grep -Fq 'title: Pride and Prejudice' out/sources/standard-ebooks-starter/search_index.yml
          grep -Fq 'title: Frankenstein' out/sources/standard-ebooks-starter/search_index.yml
          grep -Fq 'title: The Picture of Dorian Gray' out/sources/standard-ebooks-starter/search_index.yml
          grep -Fq 'title: The Time Machine' out/sources/standard-ebooks-starter/search_index.yml
          grep -Fq 'license: CC0-1.0-standard-ebooks' out/sources/standard-ebooks-starter/search_index.yml
          grep -Fq 'https://standardebooks.org/ebooks/jane-austen/pride-and-prejudice' out/sources/standard-ebooks-starter/search_index.yml
          test -f out/sources/project-madurai-starter/search_index.yml
          test -f out/sources/project-madurai-starter/README.txt
          grep -Fq 'title: திருக்குறள்' out/sources/project-madurai-starter/search_index.yml
          grep -Fq 'title: சிலப்பதிகாரம் — புகார்க் காண்டம்' out/sources/project-madurai-starter/search_index.yml
          grep -Fq 'license: Project-Madurai-origin-terms' out/sources/project-madurai-starter/search_index.yml
          grep -Fq 'https://www.projectmadurai.org/pm_etexts/utf8/pmuni0001.html' out/sources/project-madurai-starter/search_index.yml

  browser-e2e:
    name: Chromium user journeys
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WEBNR_E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.0
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Run browser user journeys
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > "${RUNNER_TEMP}/webnr-http.log" 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "${ready}" != 'true' ]; then
            cat "${RUNNER_TEMP}/webnr-http.log" >&2 || true
            exit 1
          fi

          npx playwright test --config=tests/e2e/playwright.config.cjs

  docs:
    name: Documentation quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: pip install --requirement .github/requirements-docs.txt
      - name: Build self-verifying documentation artifact
        run: |
          WEBNR_DOCS_BUILD_SHA="$(git rev-parse HEAD)" \
          WEBNR_DOCS_BUILD_SOURCE='quality-ci' \
          bash scripts/build-docs-production.sh
      - name: Validate documentation output
        run: |
          set -eu
          test -f site/index.html
          test -f site/build.json
          test -f site/sitemap.xml
          test -f site/feed_rss_created.xml
          test -f site/troubleshooting/txt-import/index.html
          test -f site/blog/2026/08/06/legado-source-guide/index.html
          test -f site/blog/2026/08/08/legal-free-novels-txt-collections/index.html
          test -f site/blog/2026/08/09/webnr-legado-web-alternative/index.html
          grep -Fq 'AutoArchive/webNR' site/index.html
          grep -Fq 'https://www.webnovel.win/' site/index.html
          grep -Fq 'Legado 用户' site/index.html
          grep -Fq 'TXT import troubleshooting' site/troubleshooting/txt-import/index.html
          grep -Fq 'TXT 导入排障' site/troubleshooting/txt-import/index.html
          grep -Fq '2026 年 Legado 书源在哪里找' site/blog/2026/08/06/legado-source-guide/index.html
          grep -Fq 'WebNR Originals' site/blog/2026/08/06/legado-source-guide/index.html
          grep -Fq 'https://www.webnovel.win/blog/2026/08/06/legado-source-guide/' site/blog/2026/08/06/legado-source-guide/index.html
          grep -Fq '2026 年哪里能合法免费看小说' site/blog/2026/08/08/legal-free-novels-txt-collections/index.html
          grep -Fq 'Standard Ebooks Starter' site/blog/2026/08/08/legal-free-novels-txt-collections/index.html
          grep -Fq 'Project Madurai' site/blog/2026/08/08/legal-free-novels-txt-collections/index.html
          grep -Fq 'Project Ben-Yehuda' site/blog/2026/08/08/legal-free-novels-txt-collections/index.html
          grep -Fq 'https://www.webnovel.win/blog/2026/08/08/legal-free-novels-txt-collections/' site/blog/2026/08/08/legal-free-novels-txt-collections/index.html
          grep -Fq 'WebNR：给 Legado 用户的一个独立网页端替代选择' site/blog/2026/08/09/webnr-legado-web-alternative/index.html
          grep -Fq 'https://www.webnovel.win/blog/2026/08/09/webnr-legado-web-alternative/' site/blog/2026/08/09/webnr-legado-web-alternative/index.html
          grep -Fq 'https://www.webnovel.win/blog/2026/08/08/legal-free-novels-txt-collections/' site/sitemap.xml
          grep -Fq 'https://www.webnovel.win/blog/2026/08/09/webnr-legado-web-alternative/' site/sitemap.xml
          grep -Fq 'https://www.webnovel.win/blog/2026/08/08/legal-free-novels-txt-collections/' site/feed_rss_created.xml
          grep -Fq 'https://www.webnovel.win/blog/2026/08/09/webnr-legado-web-alternative/' site/feed_rss_created.xml
          grep -R -Fq 'G-DGH8HNQKE4' site
          if grep -R -Fq 'G-NL0WV2XMJN' site; then
            echo 'Obsolete secondary GA4 destination found in documentation output' >&2
            exit 1
          fi
          if grep -R -E -q 'yourusername/webnr|yunwei37/webNR|https://autoarchive\.github\.io/webNR' site; then
            echo 'Obsolete repository or noncanonical documentation origin found in artifact' >&2
            exit 1
          fi

  production-evidence:
    name: Production evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout recorded deployment state
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verify recorded public builds and troubleshooting guide
        run: node scripts/verify-production-builds.mjs
