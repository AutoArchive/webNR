name: Generate Next lockfile 20260909

on:
  push:
    branches:
      - fix/npm-audit-postcss-selector-20260909

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/npm-audit-postcss-selector-20260909
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Generate patched lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.3 eslint-config-next@16.3.3
      - name: Commit generated files and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/generate-next-lock-20260909.yml
          git commit -m 'fix: upgrade Next.js to patched 16.3.3'
          git push origin HEAD:fix/npm-audit-postcss-selector-20260909
