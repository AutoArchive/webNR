name: Publish WebNR documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/requirements-docs.txt'
      - '.github/workflows/publish-docs-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: read

concurrency:
  group: webnr-documentation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, and verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_BUILD_URL: https://autoarchive.github.io/webNR/build.json
      PRODUCTION_HOME_URL: https://autoarchive.github.io/webNR/
      TROUBLESHOOTING_URL: https://autoarchive.github.io/webNR/troubleshooting/txt-import/
    steps:
      - name: Select trusted default-branch commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = 'push' ]; then
            source_sha="${PUSH_SHA}"
          else
            source_sha="$(
              curl --fail-with-body --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${REPOSITORY}/commits/${DEFAULT_BRANCH}" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])'
            )"
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source commit: ${source_sha}" >&2
            exit 1
          fi
          printf 'sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout reviewed default-branch source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: pip install --requirement .github/requirements-docs.txt

      - name: Write exact documentation build identity
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "commit": os.environ["BUILD_SHA"],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "source": "github-pages-branch",
          }
          Path("docs/build.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Disable Jekyll and remove stale custom-domain metadata
        run: |
          rm -f site/CNAME
          touch site/.nojekyll

      - name: Validate documentation artifact
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -eu
          test -f site/index.html
          test -f site/build.json
          test -f site/.nojekyll
          test ! -e site/CNAME
          test -f site/troubleshooting/txt-import/index.html
          test -f site/manual/contributing/index.html
          test -f site/manual/url-params/index.html
          grep -Fq "${BUILD_SHA}" site/build.json
          grep -Fq 'TXT import troubleshooting' site/troubleshooting/txt-import/index.html
          grep -Fq 'TXT 导入排障' site/troubleshooting/txt-import/index.html
          grep -Fq 'AutoArchive/webNR' site/index.html
          grep -Fq 'https://autoarchive.github.io/webNR/' site/index.html
          grep -R -Fq 'G-DGH8HNQKE4' site
          if grep -R -Fq 'G-NL0WV2XMJN' site; then
            echo 'Obsolete secondary GA4 destination found in documentation output' >&2
            exit 1
          fi
          if grep -R -E -q 'yourusername/webnr|yunwei37/webNR|https://www\.webnovel\.win' site; then
            echo 'Obsolete repository or documentation-domain reference in artifact' >&2
            exit 1
          fi

      - name: Publish generated site to configured Pages source
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs-deploy: ${{ steps.source.outputs.sha }}"

      - name: Wait for legacy Pages build and public documentation
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          api="https://api.github.com/repos/${REPOSITORY}"
          for attempt in $(seq 1 45); do
            pages_response="$(
              curl --fail --silent --show-error --max-time 15 \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/pages" || true
            )"
            build_response="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_BUILD_URL}?commit=${BUILD_SHA}&attempt=${attempt}" || true)"
            home_response="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_HOME_URL}?analytics-check=${BUILD_SHA}&attempt=${attempt}" || true)"
            guide_response="$(curl --fail --silent --show-error --max-time 15 "${TROUBLESHOOTING_URL}?commit=${BUILD_SHA}&attempt=${attempt}" || true)"

            pages_ready="$(
              PAGES_RESPONSE="${pages_response}" python3 - <<'PY'
          import json
          import os

          try:
              data = json.loads(os.environ.get("PAGES_RESPONSE", ""))
          except Exception:
              print("false")
          else:
              ready = (
                  data.get("build_type") == "legacy"
                  and data.get("source") == {"branch": "gh-pages", "path": "/"}
                  and not data.get("cname")
                  and data.get("status") == "built"
                  and data.get("html_url") == "https://autoarchive.github.io/webNR/"
              )
              print("true" if ready else "false")
          PY
            )"

            if [ "${pages_ready}" = 'true' ] \
              && printf '%s' "${build_response}" | grep -Fq "\"commit\": \"${BUILD_SHA}\"" \
              && printf '%s' "${home_response}" | grep -Fq 'G-DGH8HNQKE4' \
              && ! printf '%s' "${home_response}" | grep -Fq 'G-NL0WV2XMJN' \
              && printf '%s' "${guide_response}" | grep -Fq 'TXT import troubleshooting' \
              && printf '%s' "${guide_response}" | grep -Fq 'TXT 导入排障'; then
              printf 'Verified Pages configuration, documentation commit, GA4, and guide for %s\n' "${BUILD_SHA}"
              exit 0
            fi

            printf 'Attempt %s: pages-ready=%s build-bytes=%s home-bytes=%s guide-bytes=%s\n' \
              "${attempt}" "${pages_ready}" "${#build_response}" "${#home_response}" "${#guide_response}"
            sleep 10
          done
          echo "Documentation did not expose expected Pages configuration, commit, GA4, and guide for ${BUILD_SHA}" >&2
          exit 1
