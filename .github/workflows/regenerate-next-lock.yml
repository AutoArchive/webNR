name: Regenerate Next.js maintenance lockfile

on:
  push:
    branches:
      - seo/next-15-5-21-security

permissions:
  contents: write

concurrency:
  group: next-15-5-21-lockfile
  cancel-in-progress: false

jobs:
  regenerate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve package lock from npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify resolved maintenance versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const nextVersion = lock.packages?.['node_modules/next']?.version;
          const eslintConfigVersion = lock.packages?.['node_modules/eslint-config-next']?.version;
          if (nextVersion !== '15.5.21') {
            throw new Error(`Expected next 15.5.21, received ${nextVersion}`);
          }
          if (eslintConfigVersion !== '15.5.21') {
            throw new Error(`Expected eslint-config-next 15.5.21, received ${eslintConfigVersion}`);
          }
          NODE

      - name: Install exact lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Critical vulnerability audit
        run: npm audit --audit-level=critical

      - name: Remove one-time generator and commit lockfile
        run: |
          rm .github/workflows/regenerate-next-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/regenerate-next-lock.yml
          git diff --cached --check
          git commit -m 'chore: regenerate lockfile for Next.js 15.5.21'
          git push origin HEAD:${GITHUB_REF_NAME}
