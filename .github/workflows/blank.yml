name: Deploy WebNR documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/requirements-docs.txt'
      - '.github/workflows/blank.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository and skills
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: pip install --requirement .github/requirements-docs.txt

      - name: Write public documentation build identity
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "commit": os.environ["BUILD_SHA"],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "source": "github-actions",
          }
          Path("docs/build.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Validate documentation artifact
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -f site/index.html
          test -f site/build.json
          grep -Fq "${BUILD_SHA}" site/build.json
          grep -Fq 'AutoArchive/webNR' site/index.html
          if grep -R -Fq 'googletagmanager.com' site; then
            echo 'Unexpected Google Analytics loader in documentation artifact' >&2
            exit 1
          fi
          if grep -R -E -q 'yourusername/webnr|yunwei37/webNR' site; then
            echo 'Obsolete repository reference in documentation artifact' >&2
            exit 1
          fi
          touch site/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs deploy: ${{ github.sha }}"

      - name: Verify exact documentation deployment
        env:
          BUILD_SHA: ${{ github.sha }}
          PRODUCTION_BUILD_URL: https://www.webnovel.win/build.json
        run: |
          set -u
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_BUILD_URL}?commit=${BUILD_SHA}" || true)"
            if printf '%s' "${response}" | grep -Fq "\"commit\": \"${BUILD_SHA}\""; then
              printf 'Verified documentation production commit %s\n' "${BUILD_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "Documentation production did not expose expected commit ${BUILD_SHA}" >&2
          exit 1
