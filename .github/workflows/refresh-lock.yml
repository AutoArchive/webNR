name: Refresh dependency lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'seo/2026-08-13-quality-gate-repair'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Reconcile package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock update when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: reconcile dependency lock"
          git push origin HEAD:${{ github.head_ref }}
