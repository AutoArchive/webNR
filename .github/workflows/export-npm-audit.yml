name: Export npm audit report

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-report:
    if: github.head_ref == 'seo/next-15-5-21-security'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Export complete audit report
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: next-15-5-21-npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 1
