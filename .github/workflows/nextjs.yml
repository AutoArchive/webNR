name: Deploy WebNR app to Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/seo-data/**'
      - '.github/seo-skills'
      - '.github/requirements-docs.txt'
      - '.github/workflows/publish-docs-pages.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/nextjs.yml'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/verify-production-builds.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository and skills
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Write public build identity
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = {
            commit: process.env.BUILD_SHA,
            builtAt: new Date().toISOString(),
            source: 'github-actions'
          };
          fs.writeFileSync('public/build.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Build static application
        run: npm run build
      - name: Validate deployment artifact
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -f out/index.html
          test -f out/manifest.json
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/sw.js
          test -f out/build.json
          grep -Fq 'WebNR — Private Offline TXT Reader' out/index.html
          grep -Fq "${BUILD_SHA}" out/build.json
          grep -R -Fq 'G-DGH8HNQKE4' out
          if grep -R -Fq 'G-NL0WV2XMJN' out; then
            echo 'Obsolete secondary GA4 destination found in application output' >&2
            exit 1
          fi
          grep -R -Fq 'window.location.href' out
          grep -R -Fq 'window.location.pathname + window.location.search' out
          grep -R -Fq 'allow_google_signals' out
          grep -R -Fq 'allow_ad_personalization_signals' out
          touch out/.nojekyll
      - name: Publish app-pages branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: app-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
      - name: Verify exact production build
        env:
          BUILD_SHA: ${{ github.sha }}
          PRODUCTION_BUILD_URL: https://app.webnovel.win/build.json
          PRODUCTION_HOME_URL: https://app.webnovel.win/
        run: |
          set -u
          for attempt in $(seq 1 30); do
            build_response="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_BUILD_URL}?commit=${BUILD_SHA}&attempt=${attempt}" || true)"
            home_response="$(curl --fail --silent --show-error --max-time 15 "${PRODUCTION_HOME_URL}?analytics-check=${BUILD_SHA}&attempt=${attempt}" || true)"
            if printf '%s' "${build_response}" | grep -Fq "\"commit\": \"${BUILD_SHA}\"" \
              && printf '%s' "${home_response}" | grep -Fq 'G-DGH8HNQKE4' \
              && ! printf '%s' "${home_response}" | grep -Fq 'G-NL0WV2XMJN' \
              && printf '%s' "${home_response}" | grep -Fq 'window.location.href' \
              && printf '%s' "${home_response}" | grep -Fq 'window.location.pathname + window.location.search'; then
              printf 'Verified production commit and full-URL GA4 configuration for %s\n' "${BUILD_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose expected commit and full-URL GA4 configuration for ${BUILD_SHA}" >&2
          exit 1
