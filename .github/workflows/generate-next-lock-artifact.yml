name: Generate and commit Next.js lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'seo/next-15-5-21-security' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve package lock from npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify resolved maintenance versions
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const nextVersion = lock.packages?.['node_modules/next']?.version;
          const eslintConfigVersion = lock.packages?.['node_modules/eslint-config-next']?.version;
          if (nextVersion !== '15.5.21') {
            throw new Error(`Expected next 15.5.21, received ${nextVersion}`);
          }
          if (eslintConfigVersion !== '15.5.21') {
            throw new Error(`Expected eslint-config-next 15.5.21, received ${eslintConfigVersion}`);
          }
          NODE

      - name: Install and validate generated lockfile
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=critical

      - name: Commit generated lockfile and remove this workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm .github/workflows/generate-next-lock-artifact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/generate-next-lock-artifact.yml
          git diff --cached --check
          git commit -m 'chore: regenerate lockfile for Next.js 15.5.21'
          git push origin HEAD:${HEAD_BRANCH}
