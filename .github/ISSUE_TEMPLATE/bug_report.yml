name: Bug report
description: Report a reproducible WebNR product defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include imported book content, private URLs, cookies, credentials, or reading history. Security vulnerabilities belong in private vulnerability reporting.
  - type: input
    id: build
    attributes:
      label: Production build or commit
      description: Copy the commit from /build.json or provide the tested commit SHA.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First use / import
        - Library / storage
        - Reader / progress
        - PWA / offline / update
        - Text-to-speech
        - Source / repository
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use public-domain or synthetic sample data only.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version, and operating system
      placeholder: Firefox 142 on Windows 11
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed book text, filenames, private source URLs, credentials, cookies, and reading history.
          required: true
        - label: This is not a security vulnerability requiring private reporting.
          required: true
