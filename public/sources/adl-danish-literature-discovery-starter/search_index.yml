  title: ADL — 156 部已明确标记为 Public Domain 的丹麦文学作品数据集
  author: Det Kgl. Bibliotek / Det Danske Sprog- og Litteraturselskab
  description: 丹麦皇家图书馆明确标记为 Public Domain Mark 1.0 的 ADL 数据集条目，包含 156 部 1851–1945 年作品。WebNR 当前只链接其第一方说明与下载入口，不自动下载、解压或解析数据集，也不把这一权利标记外推到整个 ADL 网站。
