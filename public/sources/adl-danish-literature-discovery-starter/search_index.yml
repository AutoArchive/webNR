  title: Arkiv for Dansk Litteratur — 丹麦经典文学档案
  author: Det Kgl. Bibliotek / Det Danske Sprog- og Litteraturselskab
  description: ADL 的官方项目说明入口。项目由丹麦皇家图书馆与丹麦语言文学学会合作，覆盖 78 位作者的经典丹麦文学，并提供影印版与可检索文本。WebNR 当前仅链接第一方说明，不复制正文、影印、编辑导言或目录元数据。
