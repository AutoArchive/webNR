  author: Biblioteca Digital de Castilla-La Mancha (BIDICAM)
  description: BIDICAM 的第一方项目入口。官方说明其面向不受版权保护的卡斯蒂利亚-拉曼恰书目遗产提供开放访问，并支持检索与多格式全文下载。WebNR 当前只保存发现链接与自写说明，不抓取或重新分发上游数字对象。
