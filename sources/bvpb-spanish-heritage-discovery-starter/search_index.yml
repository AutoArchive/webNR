bvpb-spanish-heritage/rights-guidance.md:
  title: BVPB — 使用许可与版权说明
  author: Ministerio de Cultura — España
  description: BVPB 第一方法律说明指出馆藏原作多数属于公版，但数字复制品的具体许可应以各书目记录为准；多数数字作品采用 CC BY 4.0，也存在其他或更严格的许可。WebNR 仅把该页面作为权利边界说明，不复制或重发布馆藏内容。
  page_url: https://bvpb.mcu.es/es/contenido/aviso-legal.do
  source: WebNR BVPB Spanish Heritage Discovery Directory
