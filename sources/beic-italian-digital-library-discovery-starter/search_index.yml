beic-italian-digital-library/rights-guidance.md:
  title: BEIC — 使用与再利用条款
  author: Fondazione Biblioteca Europea di Informazione e Cultura
  description: BEIC 第一方条款说明数字馆藏图像可免费访问、下载和再利用，并区分公共领域作品、CC BY-SA 作品、CC0 目录数据与 BEIC 自制内容的许可。WebNR 仅把该页面作为权利边界说明，不复制或重发布馆藏内容。
  page_url: https://digital.beic.it/termini-duso/
